<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - Rentzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/components.css">
</head><body><div id="app-nav"></div><main id="app-main"></main>
<script src="/assets/js/api.js?v=2"></script><script src="/assets/js/auth.js?v=2"></script><script src="/assets/js/ui.js"></script>
<script>
Auth.requireAuth(['customer','owner','admin']);
const pid=new URLSearchParams(location.search).get('product_id');
UI.pageShell('search','<section class="page"><div class="container" id="wrap"></div></section>');
let product;
function calc(){
  const unit=document.getElementById('duration_unit').value;
  const dur=Math.max(1,parseInt(document.getElementById('duration').value||1));
  const rate=Number(product.pricing?.[unit]||0);
  const rental=rate*dur; const deposit=Number(product.deposit||0); const fee=Math.round(rental*0.05*100)/100; const total=rental+deposit+fee;
  document.getElementById('breakdown').innerHTML=`<div style="display:flex;justify-content:space-between"><span class="text-secondary">Rate (${unit})</span><span class="mono">${UI.fmtINR(rate)}</span></div>
  <div style="display:flex;justify-content:space-between"><span class="text-secondary">Duration</span><span class="mono">${dur} ${unit}(s)</span></div>
  <div style="display:flex;justify-content:space-between"><span class="text-secondary">Rental</span><span class="mono">${UI.fmtINR(rental)}</span></div>
  <div style="display:flex;justify-content:space-between"><span class="text-secondary">Platform fee (5%)</span><span class="mono">${UI.fmtINR(fee)}</span></div>
  <div style="display:flex;justify-content:space-between"><span class="text-secondary">Refundable deposit</span><span class="mono">${UI.fmtINR(deposit)}</span></div>
  <hr style="border:none;border-top:1px solid var(--border);margin:8px 0"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Total payable</span><span class="mono" style="color:var(--primary)">${UI.fmtINR(total)}</span></div>`;
  return {duration_unit:unit,duration:dur};
}
(async()=>{
  const wrap=document.getElementById('wrap'); UI.loading(wrap);
  try{product=await API.get('/api/products/'+pid);
    const today=new Date().toISOString().slice(0,10);
    wrap.innerHTML=`<h1 class="section-title">Booking checkout</h1><p class="section-sub">Review dates, pricing, and deposit before UPI intent payment.</p>
    <div class="grid" style="grid-template-columns:1fr .9fr;gap:24px;margin-top:20px">
      <div class="card"><div class="card-body"><h3 style="font-weight:700;margin-bottom:14px">Rental details</h3><div id="msg"></div>
        <form id="form"><div class="form-grid">
          <div class="field"><label>Start date</label><input class="input" type="date" name="start_date" id="start_date" min="${today}" required></div>
          <div class="field"><label>End date</label><input class="input" type="date" name="end_date" id="end_date" min="${today}" required></div>
        </div>
        <div class="form-grid"><div class="field"><label>Duration unit</label><select class="input" name="duration_unit" id="duration_unit"><option value="hour">Hour</option><option value="day" selected>Day</option><option value="week">Week</option><option value="month">Month</option></select></div>
        <div class="field"><label>Duration</label><input class="input" type="number" min="1" value="1" name="duration" id="duration"></div></div>
        <div class="field"><label>Notes</label><textarea class="input" name="notes" rows="3" placeholder="Pickup/delivery notes"></textarea></div>
        <button class="btn btn-primary" type="submit">Create booking & continue to payment</button></form></div></div>
      <div class="card"><div class="card-body"><h3 style="font-weight:700;margin-bottom:14px">${product.title}</h3><div id="breakdown" style="display:flex;flex-direction:column;gap:10px;font-size:14px"></div>
      <div class="alert alert-warning" style="margin-top:16px;font-size:13px">Payment is a mock UPI intent flow for MVP. No real money is collected.</div></div></div>
    </div>`;
    ['duration_unit','duration'].forEach(id=>document.getElementById(id).addEventListener('change',calc));
    calc();
    document.getElementById('form').onsubmit=async(e)=>{
      e.preventDefault(); const msg=document.getElementById('msg'); msg.innerHTML='';
      const fd=Object.fromEntries(new FormData(e.target).entries());
      fd.product_id=pid; fd.duration=parseInt(fd.duration||1);
      try{const b=await API.post('/api/bookings', fd); location.href='/payment.html?booking_id='+b.id;}
      catch(err){msg.innerHTML=`<div class="alert alert-danger">${err.message}</div>`}
    };
  }catch(e){UI.error(wrap,e)}
})();
</script></body></html>
