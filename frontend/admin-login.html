<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - Rentzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/components.css">
</head><body><div id="app-nav"></div><main id="app-main"></main>
<script src="/assets/js/api.js?v=2"></script><script src="/assets/js/auth.js?v=2"></script><script src="/assets/js/ui.js"></script>
<script>
UI.pageShell('login', `<section class="page"><div class="container" style="max-width:560px"><div class="card"><div class="card-body">
  <span class="badge badge-info">Admin Portal</span>
  <h1 class="section-title" style="margin-top:12px">Admin login</h1><p class="section-sub" style="margin-bottom:20px">Manage users, products, bookings, and platform operations.</p>
  <div id="msg"></div>
  <form id="form"><div class="field"><label>Email</label><input class="input" name="email" type="email" value="admin.rajesh@rentzy.com" required></div>
  <div class="field"><label>Password</label><input class="input" name="password" type="password" value="Password@123" required></div>
  <button class="btn btn-primary" style="width:100%" type="submit">Login as admin</button></form>
</div></div></div></section>`);
document.getElementById('form').onsubmit=async(e)=>{
  e.preventDefault(); const msg=document.getElementById('msg'); msg.innerHTML='';
  try{
    const r=await API.post('/api/auth/login', Object.fromEntries(new FormData(e.target).entries()));
    if(r.user.role!=='admin') throw new Error('Not an admin account');
    try { Auth.setSession(r.access_token,r.user); } catch(sErr){}
    location.href='/admin-dashboard.html';
  } catch(err){
    msg.innerHTML=`<div class="alert alert-danger">${err.message || 'Login failed'}</div>`;
  }
};
</script></body></html>
