<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Products - Rentzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/components.css">
</head><body><div id="app-nav"></div><main id="app-main"></main>
<script src="/assets/js/api.js?v=2"></script><script src="/assets/js/auth.js?v=2"></script><script src="/assets/js/ui.js"></script>
<script>
Auth.requireAuth(['customer','owner','admin']);
UI.pageShell('products', `<section class="page"><div class="container"><div style="display:flex;justify-content:space-between;align-items:end;gap:16px"><div><h1 class="section-title">My products</h1><p class="section-sub">Manage your listed rental assets.</p></div><a class="btn btn-primary" href="/add-product.html">Add product</a></div>
<div class="card" style="margin-top:20px"><div class="card-body table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Day rate</th><th>Deposit</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section>`);
async function load(){const rows=document.getElementById('rows'); try{const items=await API.get('/api/products/mine');
 rows.innerHTML=items.map(p=>`<tr><td><div style="font-weight:600">${p.title}</div><div class="text-secondary" style="font-size:12px">${p.location||''}</div></td><td>${p.category_name||''}</td><td class="mono">${UI.fmtINR(p.pricing?.day||0)}</td><td class="mono">${UI.fmtINR(p.deposit||0)}</td><td>${UI.badge(p.status)}</td><td><button class="btn btn-sm btn-danger" onclick="del('${p.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">No products yet.</div></td></tr>';
}catch(e){rows.innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}
window.del=async(id)=>{if(!confirm('Delete product?')) return; await API.del('/api/products/'+id); load();};
load();
</script></body></html>
