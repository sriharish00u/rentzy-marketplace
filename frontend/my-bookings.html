<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Bookings - Rentzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/components.css">
</head><body><div id="app-nav"></div><main id="app-main"></main>
<script src="/assets/js/api.js?v=2"></script><script src="/assets/js/auth.js?v=2"></script><script src="/assets/js/ui.js"></script>
<script>
Auth.requireAuth(['customer','owner','admin']);
UI.pageShell('bookings', `<section class="page"><div class="container">
  <h1 class="section-title">My bookings</h1><p class="section-sub">Track booking status, payment, and rental lifecycle.</p>
  <div class="card" style="margin-top:20px"><div class="card-body table-wrap"><table class="table"><thead><tr><th>Product</th><th>Dates</th><th>Total</th><th>Status</th><th>Payment</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></section>`);
(async()=>{const rows=document.getElementById('rows');
 try{const items=await API.get('/api/bookings');
  rows.innerHTML=items.map(b=>`<tr><td><div style="font-weight:600">${b.product_title||''}</div><div class="mono muted" style="font-size:12px">${b.id.slice(-8)}</div></td><td class="mono" style="font-size:13px">${b.start_date} → ${b.end_date}</td><td class="mono">${UI.fmtINR(b.pricing_breakdown?.total)}</td><td>${UI.badge(b.status)}</td><td>${UI.badge(b.payment_status)}</td><td>${b.payment_status!=='paid'?`<a class="btn btn-sm btn-primary" href="/payment.html?booking_id=${b.id}">Pay</a>`:''}</td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">No bookings yet.</div></td></tr>';
 }catch(e){rows.innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}
})();
</script></body></html>
