<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard - Rentzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/components.css">
</head><body><div id="app-nav"></div><main id="app-main"></main>
<script src="/assets/js/api.js?v=3"></script><script src="/assets/js/auth.js?v=3"></script><script src="/assets/js/ui.js?v=3"></script>
<script>
Auth.requireAuth(['admin']);
UI.pageShell('dashboard', `
<section class="page"><div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div>
      <h1 class="section-title">Admin Command Console</h1>
      <p class="section-sub">Real-time marketplace monitoring, KYC approval workflows, and custody governance.</p>
    </div>
    <div style="display:flex;gap:10px">
      <a class="btn btn-primary" href="/admin-users.html">KYC & User Manager</a>
      <a class="btn btn-outline" href="/admin-bookings.html">All Bookings</a>
    </div>
  </div>

  <div id="live-indicator" style="margin-top:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10B981;animation:pulse 2s infinite"></span>
    Live Data Active (auto-refreshing every 5s)
  </div>

  <div id="kpis" class="grid grid-4" style="margin-top:16px">
    <div class="card kpi"><div class="label">Total Users</div><div class="value" id="val-users">-</div></div>
    <div class="card kpi"><div class="label">Pending KYC</div><div class="value" id="val-kyc" style="color:var(--warning)">-</div></div>
    <div class="card kpi"><div class="label">Total Products (Live)</div><div class="value" id="val-prods">-</div></div>
    <div class="card kpi"><div class="label">Platform GMV</div><div class="value" id="val-rev">-</div></div>
    <div class="card kpi"><div class="label">Total Bookings</div><div class="value" id="val-books">-</div></div>
    <div class="card kpi"><div class="label">Active Rentals</div><div class="value" id="val-active">-</div></div>
    <div class="card kpi"><div class="label">Completed Rentals</div><div class="value" id="val-comp">-</div></div>
    <div class="card kpi"><div class="label">Blocked Accounts</div><div class="value" id="val-blocked">-</div></div>
  </div>

  <div class="grid grid-2" style="margin-top:24px;gap:20px">
    <div class="card"><div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="font-weight:700">Recent Registrations</h3>
        <a href="/admin-users.html" class="btn btn-outline btn-sm">Manage All</a>
      </div>
      <div class="table-wrap">
        <table class="table" style="font-size:13px">
          <thead><tr><th>User</th><th>Role</th><th>KYC</th><th>Action</th></tr></thead>
          <tbody id="live-users"><tr><td colspan="4"><div class="empty">Loading...</div></td></tr></tbody>
        </table>
      </div>
    </div></div>

    <div class="card"><div class="card-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="font-weight:700">Recent Booking Events</h3>
        <a href="/admin-bookings.html" class="btn btn-outline btn-sm">View All</a>
      </div>
      <div class="table-wrap">
        <table class="table" style="font-size:13px">
          <thead><tr><th>Item</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead>
          <tbody id="live-bookings"><tr><td colspan="4"><div class="empty">Loading...</div></td></tr></tbody>
        </table>
      </div>
    </div></div>
  </div>
</div></section>
<style>
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
</style>
`);

let timer = null;
async function fetchAdminData() {
  try {
    const s = await API.get('/api/dashboard/admin');
    document.getElementById('val-users').textContent = s.total_users;
    document.getElementById('val-kyc').textContent = s.pending_kyc;
    document.getElementById('val-prods').textContent = s.total_products;
    document.getElementById('val-rev').textContent = UI.fmtINR(s.total_revenue);
    document.getElementById('val-books').textContent = s.total_bookings;
    document.getElementById('val-active').textContent = s.active_rentals;
    document.getElementById('val-comp').textContent = s.completed_rentals;
    document.getElementById('val-blocked').textContent = s.blocked_users;

    const uRows = s.recent_users || [];
    document.getElementById('live-users').innerHTML = uRows.map(u => `
      <tr>
        <td><strong>${u.name}</strong><br><span class="mono text-secondary" style="font-size:11px">${u.email}</span></td>
        <td><span class="badge badge-info">${u.role}</span></td>
        <td>${UI.badge(u.kyc_status || 'pending')}</td>
        <td><a href="/admin-users.html?focus=${u.id}" class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11px">Review</a></td>
      </tr>
    `).join('') || '<tr><td colspan="4"><div class="empty">No users yet</div></td></tr>';

    const bRows = s.recent_bookings || [];
    document.getElementById('live-bookings').innerHTML = bRows.map(b => `
      <tr>
        <td><strong>${b.product_title || 'Item'}</strong></td>
        <td>${b.customer_name || 'User'}</td>
        <td>${UI.badge(b.status)}</td>
        <td class="mono">${UI.fmtINR(b.pricing_breakdown?.total)}</td>
      </tr>
    `).join('') || '<tr><td colspan="4"><div class="empty">No bookings yet</div></td></tr>';
  } catch (err) {
    console.error('Admin live poller error:', err);
  }
}

fetchAdminData();
timer = setInterval(fetchAdminData, 5000);
window.addEventListener('beforeunload', () => clearInterval(timer));
</script></body></html>
